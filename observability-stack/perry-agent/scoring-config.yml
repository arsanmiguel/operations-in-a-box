# OIAB deterministic scoring config (tunable, versioned).
# scoring.py merges this over built-in DEFAULTS; a missing/partial/garbage file
# cannot break scoring (fail-closed). Weights within a score are relative; they
# are renormalized by whichever factors are present.
version: 1

operational:
  weights:
    magnitude: 0.30      # how far above baseline
    duration: 0.15       # how long sustained
    deviation: 0.25      # z-score vs learned normal band
    blast_radius: 0.15   # how many nodes affected
    trend: 0.10          # worsening slope (predict_linear)
    off_schedule: 0.05   # outside a known benign window (:05 bulk load)
  norm:
    magnitude_full_pct: 100.0
    baseline_pct: 60.0
    duration_full_sec: 900.0
    deviation_full_z: 4.0
    blast_full_count: 3.0
    trend_full_slope: 2.0
  buckets:               # score lower-bound -> label
    critical: 80
    high: 60
    medium: 35
    low: 0

remediation:
  weights:
    savings: 0.45
    effort: 0.25
    risk: 0.15
    reversibility: 0.10
    confidence: 0.05
  norm:
    savings_full_usd: 500.0
  effort_score:          # easier -> higher priority
    easy: 1.0
    medium: 0.5
    advanced: 0.2
  risk_score:            # safer -> higher priority
    low: 1.0
    medium: 0.5
    high: 0.2
  confidence_score:
    live: 1.0
    sample: 0.5
  tier_rules:            # deterministic tier from safety composite
    easy_min: 0.75
    medium_min: 0.45
